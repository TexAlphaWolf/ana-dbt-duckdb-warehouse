version: 2

models:
  - name: stg_customers
    description: One row per customer, the latest version of each.
    columns:
      - name: customer_id
        data_tests: [unique, not_null]
      - name: email
        data_tests: [not_null]
      - name: country
        data_tests:
          - accepted_values:
              arguments:
                values: [IT, DE, FR, ES, GB, NL, SE, PL]
  - name: stg_products
    columns:
      - name: product_id
        data_tests: [unique, not_null]
      - name: price_cents
        data_tests: [non_negative]
  - name: stg_orders
    description: One row per order, with the status cleaned to pending, shipped, completed or cancelled.
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: [pending, shipped, completed, cancelled]
  - name: stg_order_items
    columns:
      - name: order_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id
      - name: product_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_products')
                field: product_id
      - name: net_cents
        data_tests: [non_negative]
  - name: stg_payments
    columns:
      - name: payment_id
        data_tests: [unique, not_null]
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: [captured, failed]
