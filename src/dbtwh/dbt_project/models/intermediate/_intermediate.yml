version: 2

models:
  - name: int_order_totals
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: net_cents
        data_tests: [non_negative]
  - name: int_order_payments
    description: Money received per order. Failed attempts are left out.
    columns:
      - name: order_id
        data_tests: [unique, not_null]

unit_tests:
  - name: int_order_totals_sums_lines_and_cost
    model: int_order_totals
    given:
      - input: ref('stg_order_items')
        rows:
          - {order_id: 1, line_no: 1, product_id: 7, quantity: 2, unit_price_cents: 1000, discount_cents: 100, gross_cents: 2000, net_cents: 1900}
          - {order_id: 1, line_no: 2, product_id: 8, quantity: 1, unit_price_cents: 500, discount_cents: 0, gross_cents: 500, net_cents: 500}
          - {order_id: 2, line_no: 1, product_id: 7, quantity: 3, unit_price_cents: 990, discount_cents: 0, gross_cents: 2970, net_cents: 2970}
      - input: ref('stg_products')
        rows:
          - {product_id: 7, category: audio, price_cents: 1000, cost_cents: 400}
          - {product_id: 8, category: cables, price_cents: 500, cost_cents: 300}
    expect:
      rows:
        - {order_id: 1, line_count: 2, units: 3, gross_cents: 2500, discount_cents: 100, net_cents: 2400, cost_cents: 1100}
        - {order_id: 2, line_count: 1, units: 3, gross_cents: 2970, discount_cents: 0, net_cents: 2970, cost_cents: 1200}

  - name: int_order_payments_counts_only_captured
    model: int_order_payments
    given:
      - input: ref('stg_payments')
        rows:
          - {payment_id: 1, order_id: 1, paid_at: '2025-01-01 10:00:00', method: card, status: failed, amount_cents: 5000}
          - {payment_id: 2, order_id: 1, paid_at: '2025-01-01 10:05:00', method: card, status: captured, amount_cents: 3000}
          - {payment_id: 3, order_id: 1, paid_at: '2025-01-01 12:00:00', method: card, status: captured, amount_cents: 2000}
          - {payment_id: 4, order_id: 2, paid_at: '2025-01-02 09:00:00', method: wallet, status: failed, amount_cents: 800}
    expect:
      rows:
        - {order_id: 1, payment_count: 2, paid_cents: 5000, first_paid_at: '2025-01-01 10:05:00', last_paid_at: '2025-01-01 12:00:00'}
